name: Validação de crescimento

on:
  pull_request:
    paths:
      - "src/**"
      - "cloudflare-worker.ts"
      - "wrangler.jsonc"
      - "scripts/validate-worker.ts"
      - "tests/growth/**"
      - "tests/collection/**"
      - "scripts/ingest-shopee-feed.ts"
      - "scripts/catalog-health.ts"
      - "scripts/build-comparison-snapshots.ts"
      - "scripts/retain-comparison-snapshots.ts"
      - ".github/workflows/comparison-snapshots.yml"
      - "scripts/run-scraper.ts"
      - "scripts/validate-collection-memory.ts"
      - "middleware.ts"
      - "package*.json"
      - "tsconfig.comparisons.json"
      - ".github/workflows/growth-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run typecheck:comparisons
      - run: npm run test:growth
      - run: npm run test:collection
      - run: npm run test:collection:memory

  catalog-index-lab:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: isolated-lab-only
          POSTGRES_DB: promodetec_catalog_lab
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: isolated-lab-only
      PGDATABASE: promodetec_catalog_lab
    steps:
      - uses: actions/checkout@v4
      - name: Comparar planos sem dados reais ou credenciais remotas
        shell: bash
        run: |
          set -o pipefail
          mkdir -p reports
          psql -X -f scripts/validate-catalog-index.sql | tee reports/catalog-index-lab.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-index-lab-${{ github.run_id }}
          path: reports/catalog-index-lab.txt
          retention-days: 14
