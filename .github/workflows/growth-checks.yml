name: Validação de crescimento

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/growth/**"
      - "tests/collection/**"
      - "scripts/ingest-shopee-feed.ts"
      - "scripts/catalog-health.ts"
      - "scripts/run-scraper.ts"
      - "scripts/validate-collection-memory.ts"
      - "middleware.ts"
      - "package*.json"
      - ".github/workflows/growth-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:growth
      - run: npm run test:collection
      - run: npm run test:collection:memory
