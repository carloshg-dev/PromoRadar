name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - codex/cloudflare-migration
  workflow_dispatch:
    inputs:
      deploy:
        description: "Publicar no Cloudflare depois da validacao"
        type: boolean
        default: false
      preflight_only:
        description: "Inspecionar Cloudflare sem build nem publicacao"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  audit:
    if: ${{ github.event.inputs.preflight_only == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/cloudflare-preflight.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloudflare-preflight-${{ github.run_id }}
          path: reports/cloudflare-preflight.json
          retention-days: 14
          if-no-files-found: error
  cloudflare:
    if: ${{ github.event.inputs.preflight_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      LOMADEE_API_KEY: ${{ secrets.LOMADEE_API_KEY }}
      ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
      ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
      ML_REDIRECT_URI: ${{ secrets.ML_REDIRECT_URI }}
      OPENNEXT_CLOUDFLARE: "1"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Validar secrets obrigatorios
        shell: bash
        run: |
          node <<'NODE'
          const required = [
            "CLOUDFLARE_API_TOKEN",
            "CLOUDFLARE_ACCOUNT_ID",
            "NEXT_PUBLIC_SUPABASE_URL",
            "NEXT_PUBLIC_SUPABASE_ANON_KEY",
            "NEXT_PUBLIC_SITE_URL",
            "SUPABASE_SERVICE_ROLE_KEY",
            "CRON_SECRET",
            "LOMADEE_API_KEY",
          ];
          const missing = required.filter((name) => !process.env[name]?.trim());
          if (missing.length > 0) {
            console.error(`Secrets ausentes: ${missing.join(", ")}`);
            process.exit(1);
          }
          NODE

      - run: npm ci

      - run: npm run typecheck

      - name: Build OpenNext Cloudflare Worker
        shell: bash
        run: |
          if [ "${{ github.event.inputs.deploy }}" != "true" ]; then
            export NEXT_PUBLIC_SITE_URL=http://127.0.0.1:3215
          fi
          npm run cf:build

      - name: Diagnosticar composicao do Worker
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const metaPath = ".open-next/server-functions/default/handler.mjs.meta.json";

          if (!fs.existsSync(metaPath)) {
            console.warn(`Metafile nao encontrado: ${metaPath}`);
            process.exit(0);
          }

          const meta = JSON.parse(fs.readFileSync(metaPath, "utf8"));
          const totals = new Map();
          for (const output of Object.values(meta.outputs ?? {})) {
            for (const [input, info] of Object.entries(output.inputs ?? {})) {
              totals.set(input, (totals.get(input) ?? 0) + (info.bytesInOutput ?? 0));
            }
          }

          console.log("Maiores entradas do Worker (KiB):");
          [...totals.entries()]
            .sort((a, b) => b[1] - a[1])
            .slice(0, 25)
            .forEach(([input, bytes]) => {
              console.log(`${(bytes / 1024).toFixed(1).padStart(9)}  ${input}`);
            });
          NODE

      - name: Validar pacote Cloudflare sem publicar
        shell: bash
        run: |
          set -o pipefail
          npx wrangler deploy --dry-run --outdir .wrangler/dry-run 2>&1 | tee "$RUNNER_TEMP/wrangler-dry-run.log"
          node <<'NODE'
          const fs = require("node:fs");
          const log = fs.readFileSync(`${process.env.RUNNER_TEMP}/wrangler-dry-run.log`, "utf8");
          const match = log.match(/gzip:\s*([\d.]+)\s*(B|KiB|MiB)/i);
          if (!match) {
            console.error("Nao foi possivel medir o tamanho gzip informado pelo Wrangler.");
            process.exit(1);
          }

          const value = Number(match[1]);
          const unit = match[2].toLowerCase();
          const bytes = unit === "mib" ? value * 1024 * 1024 : unit === "kib" ? value * 1024 : value;
          const freeLimit = 3 * 1024 * 1024;
          console.log(`Worker gzip: ${(bytes / 1024).toFixed(2)} KiB de 3072 KiB (plano Free).`);
          if (bytes > freeLimit) {
            console.error("Bundle acima do limite gratuito; deploy real bloqueado antes da API Cloudflare.");
            process.exit(1);
          }
          NODE

      - name: Homologar Worker local sem publicar
        if: ${{ github.event.inputs.deploy != 'true' }}
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/promodetec-worker-runtime" --no-save --package-lock=false wrangler@4.151.2
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          if (fs.existsSync(".env.example")) fs.renameSync(".env.example", path.join(process.env.RUNNER_TEMP, "promodetec-env.example"));
          const names = ["NEXT_PUBLIC_SUPABASE_URL", "NEXT_PUBLIC_SUPABASE_ANON_KEY", "NEXT_PUBLIC_SITE_URL"];
          const values = { ...process.env, NEXT_PUBLIC_SITE_URL: "http://127.0.0.1:3215" };
          fs.writeFileSync(".env.local", names.map(name => `${name}=${values[name]}`).join("\n"), { mode: 0o600 });
          NODE
          export PROMODETEC_WORKER_WRANGLER="$RUNNER_TEMP/promodetec-worker-runtime/node_modules/wrangler/bin/wrangler.js"
          npm run test:worker
          node <<'NODE'
          const fs = require("node:fs");
          const assert = require("node:assert/strict");
          const buildId = fs.readFileSync(".next/BUILD_ID", "utf8").trim();
          const receipt = fs.readdirSync("docs/evidence").filter(name => /^worker-lab-.*\.json$/.test(name))
            .map(name => JSON.parse(fs.readFileSync(`docs/evidence/${name}`, "utf8"))).find(report => report.buildId === buildId);
          assert.ok(receipt, "worker_receipt_must_match_current_build");
          assert.equal(receipt.failed, 0);
          assert.equal(receipt.effectiveCompatibilityDate, receipt.requestedCompatibilityDate);
          fs.mkdirSync("reports", { recursive: true });
          fs.writeFileSync("reports/worker-ui-receipt.json", JSON.stringify(receipt, null, 2));
          NODE

      - uses: actions/upload-artifact@v4
        if: ${{ success() && github.event.inputs.deploy != 'true' }}
        with:
          name: worker-ui-receipt-${{ github.run_id }}
          path: reports/worker-ui-receipt.json
          if-no-files-found: error
          retention-days: 14

      - name: Preparar bindings secretos de runtime
        if: ${{ github.event.inputs.deploy == 'true' }}
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");

          const required = [
            "NEXT_PUBLIC_SUPABASE_URL",
            "NEXT_PUBLIC_SUPABASE_ANON_KEY",
            "NEXT_PUBLIC_SITE_URL",
            "SUPABASE_SERVICE_ROLE_KEY",
            "CRON_SECRET",
            "LOMADEE_API_KEY",
          ];
          const mercadoLivre = ["ML_CLIENT_ID", "ML_CLIENT_SECRET", "ML_REDIRECT_URI"];
          const configuredMl = mercadoLivre.filter((name) => process.env[name]?.trim());
          if (configuredMl.length > 0 && configuredMl.length !== mercadoLivre.length) {
            console.error("O conjunto de secrets do Mercado Livre esta incompleto.");
            process.exit(1);
          }

          const names = configuredMl.length === mercadoLivre.length
            ? [...required, ...mercadoLivre]
            : required;
          const values = Object.fromEntries(names.map((name) => [name, process.env[name]]));
          const target = path.join(process.env.RUNNER_TEMP, "promodetec-runtime-secrets.json");
          fs.writeFileSync(target, JSON.stringify(values), { mode: 0o600 });
          NODE

      - name: Publicar no Cloudflare Workers
        if: ${{ github.event.inputs.deploy == 'true' }}
        run: npx opennextjs-cloudflare deploy -- --keep-vars

      - name: Sincronizar bindings secretos de runtime
        if: ${{ github.event.inputs.deploy == 'true' }}
        shell: bash
        run: npx wrangler secret bulk "$RUNNER_TEMP/promodetec-runtime-secrets.json" --name promodetec

      - name: Remover arquivo temporario de secrets
        if: ${{ always() && github.event.inputs.deploy == 'true' }}
        shell: bash
        run: rm -f "$RUNNER_TEMP/promodetec-runtime-secrets.json"
