name: Pipeline de Conteúdo (Achados do dia)

# Curadoria → Render → Publisher, 1x/dia de MANHÃ, DEPOIS da coleta (06:00 BRT).
# Roda às 12:00 UTC = 09:00 BRT: o banco já foi alimentado pela madrugada.
# Ponto único (scripts/pipeline-conteudo.ts) — idempotente via tabela `campanhas`.
# Quando migrar pra Oracle/OpenClaw, é o MESMO comando num cron de lá.

on:
  schedule:
    - cron: "0 12 * * *" # 09:00 BRT
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Gerar rascunhos locais sem gravar no banco nem publicar"
        type: boolean
        default: true

concurrency:
  group: conteudo
  cancel-in-progress: false

jobs:
  conteudo:
    name: Rascunhos diários e canal Telegram da marca
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_FEED_CHAT_ID: ${{ secrets.TELEGRAM_FEED_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4 # traz assets/fonts/*.ttf pro render
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - name: Preparar rascunhos de achadinhos
        run: npx tsx scripts/pipeline-conteudo.ts --dry-run
      - name: Publicar no canal Telegram configurado
        if: ${{ env.TELEGRAM_FEED_CHAT_ID != '' && github.event.inputs.dry_run != 'true' }}
        run: npx tsx scripts/pipeline-conteudo.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: promodetec-marketing-drafts-${{ github.run_id }}
          path: reports/marketing-drafts/
          if-no-files-found: error
          retention-days: 14
