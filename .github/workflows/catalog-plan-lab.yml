name: Laboratorio isolado de indice do catalogo
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  catalog-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: isolated-lab-only
          POSTGRES_DB: promodetec_catalog_lab
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: isolated-lab-only
      PGDATABASE: promodetec_catalog_lab
    steps:
      - uses: actions/checkout@v4
      - name: Comparar planos sem dados reais ou credenciais remotas
        shell: bash
        run: |
          set -o pipefail
          mkdir -p reports
          psql -X -f scripts/validate-catalog-index.sql | tee reports/catalog-index-lab.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-index-lab-${{ github.run_id }}
          path: reports/catalog-index-lab.txt
          retention-days: 14
