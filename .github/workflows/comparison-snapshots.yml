name: Comparações pré-calculadas

on:
  workflow_dispatch: {}
  schedule:
    - cron: "15 11,2 * * *" # 08:15 e 23:15 BRT, após as janelas usuais de coleta
  workflow_run:
    workflows: ["Coleta (jobs paralelos, 1x/dia)", "Ingestao Shopee Feed"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: comparison-snapshots
  cancel-in-progress: false

jobs:
  generate:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/cloudflare-migration
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run cache:comparisons -- --publish
      - name: Simular retenção do cache sem excluir objetos
        run: npm run cache:comparisons:retention
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: comparison-snapshots-${{ github.run_id }}
          path: |
            reports/comparison-snapshots.json
            reports/comparison-retention.json
          if-no-files-found: error
          retention-days: 14
